source = colors.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    screencopy_mode = 1                            # Forces the VM virtual display to render the wallpaper correctly
}

background {
    monitor =
    # NOTE: use only 1 path
    #path = screenshot   # screenshot of your desktop
    #path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = /home/suryaansh/wallpaper.jpg           # UPDATED: random default wall just for the lock screen

    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 3
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgb(255, 255, 255)                     # UPDATED: Crisp, bright white for maximum visibility
    font_size = 140                                # UPDATED: Scaled up from 112
    font_family = Adwaita Sans
    shadow_passes = 3                              # UPDATED: Added heavy drop shadow backplate so text pops off dark backgrounds
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)

    position = 0, 250                              # Adjusted positioning slightly for the larger font
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgb(230, 235, 255)                     # UPDATED: High-contrast soft white
    font_size = 140                                # UPDATED: Scaled up from 112
    font_family = Adwaita Sans
    shadow_passes = 3                              # UPDATED: Added heavy drop shadow backplate
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)

    position = 0, 80
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgb(180, 160, 255)                     # UPDATED: Vivid bright purple/lavender accent
    font_size = 24                                 # UPDATED: Scaled up from 18
    font_family = JetBrainsMono NFM
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -30
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = rgb(200, 200, 215)                     # UPDATED: High-contrast light gray
    font_size = 18                                 # UPDATED: Scaled up from 14
    font_family = JetBrainsMono Nerd Font 10
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -65
    halign = center
    valign = center
}

# Degrees
#label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = $color8
    font_size = 14
    font_family = JetBrainsMono NFM

    position = 0, 40
    halign = center
    valign = bottom
}

# USER
#label {
    monitor =
    text = $USER
    color = $color8
    font_size = 14
    font_family = JetBrainsMono NFM Bold
    position = 0, 200
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 320, 60                                 # UPDATED: Substantially wider and taller entry capsule
    outline_thickness = 4                          # UPDATED: Thicker border for better clarity

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # Fixed Typo: changed dots_rouding to dots_rounding

    rounding = 22
    outer_color = rgb(151, 134, 213)               # UPDATED: Bright vibrant accent purple border
    inner_color = rgba(255, 255, 255, 0.18)        # UPDATED: Lighter, more opaque frosted background container
    font_color = rgb(255, 255, 255)                # UPDATED: White text characters so typing is explicitly visible
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, 120
    halign = center
    valign = bottom
}
